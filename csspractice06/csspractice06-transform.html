<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="./csspractice06-transform.css">
    <style>
        a {
            text-decoration: none;
            color: inherit;
            border:10px solid black;
            display: block;
        }

        body,
        ul,
        li {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* .con {
            border: 10px solid black;
        } */

        .con>ul {
            border: 10px solid red;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
        }
        .con > ul > li {
            display: flex;
            border:10px solid blue;
            width:300px;
            height: 300px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            transform: translate(-10px, -10px);
        }
        .con > ul > ul {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* transform: translate(0, -10px); */
            transition: all 2s ease;
            transform-origin: 50% -47.222222%;
            border:2px solid orange;
        }
        .con > ul > ul > li > a {
            width: 300px;
            height: 100px;
        }
         .con > ul:hover > ul {
            /* transform:translate(340px, -10px)  rotate(-90deg) ; */
            transform: rotate(-90deg) ;
        }

        
    </style>
</head>

<body>
    <div class="con">
        <ul>

            <li><a href="#">rotate!</a></li>
            <ul>
                <li><a href="#">text1</a></li>
                <li><a href="#">text2</a></li>
                <li><a href="#">text3</a></li>
                <li><a href="#">text4</a></li>
            </ul>

        </ul>
    </div>
</body>

</html>
