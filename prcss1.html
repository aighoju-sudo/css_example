<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, ul, li {
            margin:0;
            padding:0;
            list-style:none;
        }
        a {
            color:inherit;
            text-decoration:none;
        }
        .con-min-width {
            min-width: 1200px;
            padding: 0 10px;
        }
        .con {
            margin-left:auto;
            margin-right:auto;

            width:1200px;
            /*width: 700px로 요소의 너비를 고정했기 때문에 부모 요소 안에 남는 공간이 생깁니다. 양쪽 margin: auto가 그 남는 공간을 똑같이 나눠 가져서 가운데 정렬됩니다.
            반대로 width: 700px를 삭제하면 블록 요소의 너비가 기본값인 auto가 되어 부모 너비 전체를 차지합니다.*/
        }
        .menu-bar__menu-box-1 > ul > li {
            display:inline-block;
        }
        .menu-bar__menu-box-1 > ul {
            text-align:center;
        }
        .logo-bar > div {
            text-align:center;
        }
        .logo-bar > div > .logo-bar__logo {
            font-size:5rem;
        }
        .menu-bar__menu-box-1 > ul > li > a {
            display:block;
            font-size:2rem;
            padding:10px 30px;
        }
        .menu-bar__menu-box-1 > ul > li:hover > a {
            color:red;
            text-decoration:underline;
        }
        .logo-bar > div > a {
            text-decoration:underline;
        }
    </style>
</head>

<body>
    <header>
        <h1 class="logo-bar con-min-width">
            <div class="text-align-center con">
                <a href="#" class="logo-bar__logo">
                    <span class="ico-1"><i class="fa-solid fa-plane"></i></span>
                    <span>
                        <span>me-</span><span>in</span><span>-journey</span>
                    </span>
                </a>
            </div>
        </h1>
        <h2 class="menu-bar con-min-width">
            <div class="con">
                <nav class="menu-bar__menu-box-1 text-align-center">
                    <ul>
                        <li><a href="#">Home</a></li>
                        <li><a href="#">Read</a></li>
                        <li><a href="#">Write</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">SNS</a></li>
                        <li><a href="#">Study</a></li>
                        <li><a href="#">Exit</a></li>
                    </ul>
                </nav>
            </div>
        </h2>
    </header>
</body>

</html>
