<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="./csspractice04-circle.css">
    <style>
        body,
        ul,
        li {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

        }

        a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .con>ul>li>ul {
            display: none;
        }

        .con>ul>li {
            border: 10px solid red;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            text-align: center;
            line-height: 100px;
        }

        .con>ul>li>ul {
            border: 10px solid orange;
            line-height: 50px;
            /********/
        }

        .con>ul>li:hover>ul {
            display: block;
        }

        .con {
            border: 10px solid black;
            display: block;
        }

        .con>ul {
            display: flex;
            border: 10px solid blue;
            align-items: center;
            justify-content: center;
        }
        .con >ul >li >ul>li>a{
            border:3px solid black;
            background-color: gray;
            border-radius: 20%;
        }
        .con>ul>li>ul>li {
            border:10px solid pink;
        }
    </style>
</head>

<body>
    <nav>
        <div class="con">
            <ul>
                <li>
                    <a href="#">circle</a>
                    <ul>
                        <li><a href="#">text1</a></li>
                        <li><a href="#">text1</a></li>
                        <li><a href="#">text1</a></li>
                        <li><a href="#">text1</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
</body>

</html>
